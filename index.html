<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Trening — plan FBW z ochroną lędźwi</title>
<style>
:root{--bg:#14171b;--panel:#1d2127;--panel2:#232830;--line:#2e343d;--text:#e9ebee;--muted:#9aa3ad;--faint:#6b7480;--accent:#e8a13d;--accent-deep:#c9831f;--safe:#5fb878;--warn:#e4c05c;--block:#d96c5f;--radius:14px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;min-height:100%}
body{padding-bottom:0}
body.flash{animation:flashbg .9s ease}
@keyframes flashbg{0%,100%{background:var(--bg)}30%{background:#4a3510}}
html{font-size:calc(16px * var(--fscale, 1))}
h1,h2,h3{margin:0 0 .4em;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:.3em 0}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.screen{display:none;padding:18px 16px 24px;max-width:640px;margin:0 auto}
.screen.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.card.sub{background:var(--panel2)}
button{font:inherit;color:inherit;border:none;cursor:pointer;border-radius:12px}
.btn{display:block;width:100%;padding:14px;background:var(--accent);color:#1a1408;font-weight:700;font-size:1.05rem;border-radius:12px;min-height:48px}
.btn:active{background:var(--accent-deep)}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.small{width:auto;padding:8px 14px;font-size:.9rem;display:inline-block;min-height:0}
.btn.danger{background:transparent;color:var(--block);border:1px solid var(--block)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;padding:9px 6px;background:transparent;color:var(--muted);font-weight:600;border-radius:9px;font-size:.95rem;min-height:42px}
.seg button.on{background:var(--accent);color:#1a1408}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tag.safe{background:rgba(95,184,120,.15);color:var(--safe)}
.tag.warn{background:rgba(228,192,92,.15);color:var(--warn)}
.tag.block{background:rgba(217,108,95,.15);color:var(--block)}
.spine-tip{display:flex;gap:8px;align-items:flex-start;background:rgba(232,161,61,.08);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 8px 8px 0;margin:8px 0;font-size:.85rem}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101317;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav#tabs button{flex:1;background:none;color:var(--faint);padding:9px 2px 7px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0;font-weight:600}
nav#tabs button.on{color:var(--accent)}
#akcjaBar{display:none}
#akcjaBar.show{display:block}
#akcjaBar .btn{margin:0}
nav#tabs svg{width:22px;height:22px}
input[type=number],input[type=text],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit;min-height:42px}
input[type=number]{text-align:center}
textarea{min-height:70px;resize:vertical}
label.fld{display:block;margin:10px 0}
label.fld span{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin:6px 0}
.setrow .n{color:var(--muted);font-size:.85rem;text-align:center}
.setrow .del{background:none;color:var(--faint);font-size:1.1rem;padding:6px}
.sethead{display:grid;grid-template-columns:34px 1fr 1fr 1fr 40px;gap:6px;font-size:.68rem;color:var(--faint);text-transform:uppercase;text-align:center;margin-top:8px}
#stickyTimer{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:#20242b;border:1px solid var(--accent);border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:60;max-width:616px;margin:0 auto}
#stickyTimer.show{display:flex}
#stickyTimer .t{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.exdrawing{background:var(--panel2);border-radius:10px;padding:6px;margin:8px 0;text-align:center}
.range-wrap{margin:10px 0}
.ocena{display:flex;flex-wrap:wrap;gap:2%;margin:6px 0}
.ocena button{width:17%;aspect-ratio:1.2;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;margin-bottom:6px}
.ocena button.on{color:#1a1408}
.suggest{border-left:3px solid var(--safe);background:rgba(95,184,120,.07);padding:8px 10px;border-radius:0 8px 8px 0;font-size:.85rem;margin:6px 0}
.suggest.down{border-color:var(--block);background:rgba(217,108,95,.07)}
.notice{border:1px solid var(--warn);background:rgba(228,192,92,.07);border-radius:12px;padding:10px 12px;font-size:.85rem;margin:10px 0}
.notice.red{border-color:var(--block);background:rgba(217,108,95,.08)}
.hr{height:1px;background:var(--line);margin:12px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stat{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.chartbox{background:var(--panel2);border-radius:10px;padding:8px;margin:8px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;overflow-x:auto}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.cwhead{display:flex;align-items:center;gap:10px;cursor:pointer}
.cwmark{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--faint);color:var(--faint);font-size:.8rem;font-weight:700;flex:none}
.cwmark.done{background:var(--safe);border:none;color:#1a1408}
.cwname{font-size:1rem;font-weight:700;flex:1}
.cwname.done{color:var(--muted);text-decoration:line-through}
.exicon{width:46px;height:40px;background:var(--panel2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end}
.modal.show{display:flex}
.modal-inner{background:var(--panel);border-radius:18px 18px 0 0;max-height:75%;width:100%;max-width:640px;margin:0 auto;padding:16px;overflow-y:auto}
.exrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
</style>
</head>
<body>
<div id="stickyTimer"><div class="t" id="stickyTime">0:00</div><div style="flex:1"><div class="tiny muted" id="stickyLabel">Przerwa</div></div><button class="btn small secondary" id="stickyStop">Stop</button></div>
<div id="app"></div>
<div class="modal" id="modal"><div class="modal-inner"><h3 id="modalTytul"></h3><div id="modalLista"></div><button class="btn secondary" style="margin-top:10px" onclick="zamknijModal()">Zamknij</button></div></div>
<div id="akcjaBar" style="position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:55;padding:8px 12px;background:linear-gradient(to top,rgba(16,19,23,.98),rgba(16,19,23,.85));backdrop-filter:blur(4px)"><div style="max-width:640px;margin:0 auto"></div></div>

<button data-tab="biblioteka"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15 6l4 1-3 13-4-1z"/></svg>Ćwiczenia</button>

</nav>

window.onerror=function(m,s,l){try{var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:#7a2e26;color:#fff;padding:10px;font-size:13px';d.textContent='Błąd: '+m+' (linia '+l+')';document.body.appendChild(d);}catch(e){}};
var DATA={"EX": [{"id": "suwnica", "q": "leg press machine technique", "nazwa": "Suwnica", "en": "leg press", "partia": "nogi", "sprzet": ["s"], "safety": "warn", "typ": "w", "fig": "legpress", "st": {"m": 0.6}, "poz": "Usiądź głęboko, plecy i miednica dociśnięte do oparcia. Stopy na platformie na szerokość bioder, całe stopy przylegają, palce lekko na zewnątrz.", "ruch": "Wypchnij platformę do prawie pełnego wyprostu kolan (nie blokuj ich do końca). Opuszczaj powoli, 2-3 sekundy, tylko do momentu, w którym miednica jeszcze leży płasko na oparciu.", "odd": "Wdech przy opuszczaniu, wydech przy wypychaniu.", "blad": "Zbyt głębokie opuszczanie: miednica odrywa się od oparcia i lędźwie wchodzą w zgięcie pod obciążeniem.", "wsk": "Lędźwie i miednica dociśnięte do oparcia przez cały ruch. Skróć zakres, zanim miednica zacznie się podwijać."}, {"id": "przysiad-krzeslo", "q": "box squat to chair form", "nazwa": "Przysiad do krzesła z gumą", "en": "box squat / banded squat", "partia": "nogi", "sprzet": ["d"], "safety": "warn", "typ": "w", "fig": "squatChair", "stDom": "sama masa ciała; gdy 15 powtórzeń robi się łatwe, stań na gumie średniej i trzymaj końce przy barkach", "poz": "Stań przed krzesłem, stopy na szerokość bioder, palce lekko na zewnątrz. Ramiona wyciągnięte w przód dla równowagi (albo końce gumy przy barkach).", "ruch": "Prowadź biodra w tył i w dół, jakbyś siadał, aż pośladki dotkną krzesła. Nie klapnij, tylko dotknij i od razu wstań, wciskając stopy w podłogę.", "odd": "Wdech przy siadaniu, wydech przy wstawaniu.", "blad": "Zaokrąglanie pleców przy siadaniu i klapnięcie na krzesło zamiast kontrolowanego zejścia.", "wsk": "Neutralny odcinek lędźwiowy, klatka otwarta, nie schodź poniżej zakresu, w którym trzymasz proste plecy."}, {"id": "sciaganie-drazka", "q": "lat pulldown technique", "nazwa": "Ściąganie drążka wyciągu górnego", "en": "lat pulldown", "partia": "plecy", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "pull", "st": {"m": 0.4}, "poz": "Usiądź, uda zablokowane pod wałkiem, chwyt nieco szerzej niż barki. Wyprostuj ramiona, poczuj rozciągnięcie pleców.", "ruch": "Najpierw ściągnij łopatki w dół, potem przyciągnij drążek do górnej części klatki, prowadząc łokcie w dół i lekko do tyłu. Wróć powoli do pełnego wyprostu ramion.", "odd": "Wydech przy ściąganiu, wdech przy powrocie.", "blad": "Odchylanie tułowia mocno w tył i szarpanie ciężaru zamiast pracy pleców.", "wsk": "Tułów stabilny, lekkie odchylenie maks. 10-15 stopni. Bez bujania lędźwiami."}, {"id": "sciaganie-gumy-gora", "q": "kneeling resistance band lat pulldown", "nazwa": "Ściąganie gumy zaczepionej u góry", "en": "band pulldown", "partia": "plecy", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "pull", "stDom": "guma średnia (opór ok. 15-25 kg); zaczep stabilnie u góry drzwi", "poz": "Zaczep gumę u góry (kotwica na drzwiach albo solidny hak). Klęknij lub usiądź twarzą do zaczepu, ramiona wyciągnięte w górę, guma lekko napięta już na starcie.", "ruch": "Ściągnij końce gumy do górnej części klatki, prowadząc łokcie w dół wzdłuż tułowia. Zatrzymaj na sekundę, wróć powoli do góry.", "odd": "Wydech przy ściąganiu, wdech przy powrocie.", "blad": "Wzruszanie barkami do uszu i praca samymi rękami.", "wsk": "Ściągnij łopatki w dół zanim zaczniesz ruch. Tułów pionowo, bez bujania."}, {"id": "wyciskanie-maszyna", "q": "seated chest press machine form", "nazwa": "Wyciskanie siedząc na maszynie", "en": "seated chest press", "partia": "klatka", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "press", "st": {"m": 0.3}, "poz": "Usiądź tak, żeby uchwyty były na wysokości środka klatki. Plecy i głowa przylegają do oparcia, stopy płasko na podłodze.", "ruch": "Wypchnij uchwyty przed siebie do prawie pełnego wyprostu łokci. Wracaj powoli, aż poczujesz lekkie rozciągnięcie klatki, bez uciekania łokci mocno za plecy.", "odd": "Wydech przy wypychaniu, wdech przy powrocie.", "blad": "Mostkowanie: odrywanie lędźwi od oparcia, żeby wycisnąć więcej.", "wsk": "Lędźwie dociśnięte do oparcia przez cały ruch. Jak musisz mostkować, ciężar jest za duży."}, {"id": "pompki-podwyzszenie", "q": "incline push up form", "nazwa": "Pompki na podwyższeniu", "en": "incline push-up", "partia": "klatka", "sprzet": ["d"], "safety": "safe", "typ": "r", "fig": "push", "stDom": "wysokość blatu kuchennego; im niższe podparcie, tym ciężej — schodź stopniowo (blat, sofa, podłoga)", "poz": "Dłonie na stabilnym podwyższeniu (blat, komoda) nieco szerzej niż barki. Ciało w jednej linii od głowy do pięt, brzuch i pośladki napięte.", "ruch": "Ugnij łokcie i opuść klatkę do podwyższenia, łokcie pod kątem ok. 45 stopni od tułowia. Wypchnij się do wyprostu ramion, nie gubiąc linii ciała.", "odd": "Wdech przy opuszczaniu, wydech przy wypychaniu.", "blad": "Opadające biodra: lędźwie zapadają się w przeprost.", "wsk": "Napnij brzuch i pośladki jak w planku, biodra w linii z barkami przez cały ruch."}, {"id": "hip-thrust", "q": "hip thrust machine form", "nazwa": "Hip thrust na maszynie / z obciążeniem", "en": "hip thrust", "partia": "pośladki", "sprzet": ["s"], "safety": "warn", "typ": "w", "fig": "bridge", "st": {"m": 0.5}, "poz": "Górna część pleców oparta o ławkę lub siedzisko maszyny, ciężar na biodrach, stopy płasko na podłodze na szerokość bioder, kolana zgięte ok. 90 stopni.", "ruch": "Wypchnij biodra w górę siłą pośladków do linii kolano-biodro-bark. Zatrzymaj 1 sekundę na górze, opuść powoli, nie kładąc ciężaru całkiem na podłodze.", "odd": "Wydech przy unoszeniu, wdech przy opuszczaniu.", "blad": "Przeprost lędźwi na górze: wypychanie brzucha do sufitu zamiast napięcia pośladków.", "wsk": "Kończ ruch napięciem pośladków, nie przeprostem lędźwi. Żebra ściągnięte w dół, podwiń lekko miednicę na górze."}, {"id": "glute-bridge-guma", "q": "glute bridge resistance band knees", "nazwa": "Glute bridge z gumą nad kolanami", "en": "glute bridge", "partia": "pośladki", "sprzet": ["d"], "safety": "safe", "typ": "r", "fig": "bridge", "stDom": "guma średnia nad kolanami; bez gumy, jeśli 15 powtórzeń jest jeszcze trudne", "poz": "Leżenie na plecach, kolana zgięte, stopy płasko na podłodze blisko pośladków, guma nad kolanami. Ramiona wzdłuż tułowia.", "ruch": "Unieś biodra napinając pośladki i cały czas rozpychając gumę kolanami na zewnątrz. Góra ruchu to linia kolano-biodro-bark. Zatrzymaj 1-2 sekundy, opuść powoli.", "odd": "Wydech przy unoszeniu, wdech przy opuszczaniu.", "blad": "Przeprost lędźwi zamiast pracy pośladków na górze ruchu.", "wsk": "Góra ruchu = linia kolano-biodro-bark. Ani centymetra wyżej."}, {"id": "wznosy-hantle", "q": "seated dumbbell lateral raise", "nazwa": "Wznosy bokiem hantli siedząc z podparciem", "en": "seated lateral raise", "partia": "barki", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "raise", "st": {"kg": 5}, "poz": "Siad na ławce z oparciem, plecy przylegają, hantle w dłoniach wzdłuż tułowia, łokcie minimalnie ugięte.", "ruch": "Unieś ramiona bokiem do wysokości barków, prowadząc ruch łokciami, nie dłońmi. Zatrzymaj moment na górze, opuść powoli, 2-3 sekundy.", "odd": "Wydech przy unoszeniu, wdech przy opuszczaniu.", "blad": "Bujanie tułowiem i podrzucanie ciężaru biodrami.", "wsk": "Plecy cały czas przy oparciu. Podparcie właśnie po to, żeby lędźwie nie pracowały."}, {"id": "wznosy-guma", "q": "resistance band lateral raise", "nazwa": "Wznosy bokiem z gumą", "en": "band lateral raise", "partia": "barki", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "raise", "stDom": "guma lekka; barki nie lubią dużego oporu w tym ruchu", "poz": "Stań obiema stopami na środku gumy, końce w dłoniach wzdłuż tułowia, łokcie minimalnie ugięte, brzuch napięty.", "ruch": "Unieś ramiona bokiem do wysokości barków, opuść powoli. Ruch prowadzi łokieć, dłoń jest tylko przedłużeniem.", "odd": "Wydech przy unoszeniu, wdech przy opuszczaniu.", "blad": "Odchylanie tułowia w tył przy zmęczeniu.", "wsk": "Napnij brzuch, żebra w dół, tułów pionowo. Lżejsza guma zamiast wyginania się."}, {"id": "wioslowanie-maszyna", "q": "chest supported row machine", "nazwa": "Wiosłowanie na maszynie z podparciem klatki", "en": "chest supported row", "partia": "plecy", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "row", "st": {"m": 0.35}, "poz": "Klatka oparta o poduszkę maszyny, stopy stabilnie na podpórkach, ramiona wyciągnięte do uchwytów.", "ruch": "Przyciągnij uchwyty do siebie, zaczynając od ściągnięcia łopatek, łokcie blisko tułowia. Zatrzymaj 1 sekundę przy klatce, wróć powoli do pełnego wyprostu.", "odd": "Wydech przy przyciąganiu, wdech przy powrocie.", "blad": "Odrywanie klatki od podparcia i szarpanie ciężaru.", "wsk": "Klatka przyklejona do podparcia przez cały ruch. To ono zdejmuje pracę z lędźwi."}, {"id": "wioslowanie-guma-siad", "q": "seated resistance band row floor", "nazwa": "Wiosłowanie gumą w siadzie", "en": "seated band row", "partia": "plecy", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "row", "stDom": "guma średnia zaczepiona o stopy; złap bliżej stóp = większy opór", "poz": "Siad na podłodze, nogi wyprostowane z lekkim ugięciem kolan, guma zaczepiona o środek stóp, plecy proste, tułów pionowo.", "ruch": "Przyciągnij końce gumy do brzucha, ściągając łopatki i prowadząc łokcie przy tułowiu. Zatrzymaj 1 sekundę, wróć powoli, nie garbiąc się.", "odd": "Wydech przy przyciąganiu, wdech przy powrocie.", "blad": "Zaokrąglanie pleców i bujanie tułowiem w przód-tył.", "wsk": "Tułów pionowo, proste plecy. Ruch robią ramiona i łopatki, nie kręgosłup."}, {"id": "leg-curl", "q": "leg curl machine form", "nazwa": "Uginanie nóg na maszynie", "en": "leg curl", "partia": "tył uda", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "curl", "st": {"m": 0.25}, "poz": "Ułóż się na maszynie (leżąc lub siedząc) tak, żeby oś obrotu maszyny była na wysokości kolan. Wałek tuż nad piętami, biodra dociśnięte.", "ruch": "Ugnij kolana, przyciągając pięty w stronę pośladków, płynnie i bez zamachu. Wróć powoli do prawie pełnego wyprostu.", "odd": "Wydech przy uginaniu, wdech przy powrocie.", "blad": "Unoszenie bioder z siedziska przy za dużym ciężarze.", "wsk": "Biodra dociśnięte do maszyny, lędźwie neutralnie. Bez zarzucania ciężarem."}, {"id": "uginanie-guma", "q": "standing banded leg curl", "nazwa": "Uginanie nogi z gumą stojąc", "en": "standing band leg curl", "partia": "tył uda", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "curl", "stDom": "guma lekka lub średnia, zaczepiona nisko i o kostkę", "poz": "Guma zaczepiona nisko (np. o nogę mebla) i o kostkę roboczej nogi. Stań przodem do zaczepu, przytrzymaj się ściany lub krzesła, brzuch napięty.", "ruch": "Ugnij kolano, przyciągając piętę do pośladka, udo pionowo i nieruchomo. Zatrzymaj moment, wróć powoli. Wszystkie powtórzenia jedną nogą, potem zmiana.", "odd": "Wydech przy uginaniu, wdech przy powrocie.", "blad": "Wyginanie lędźwi w przeprost przy uginaniu nogi.", "wsk": "Napnij brzuch i pośladek nogi stojącej, biodra nieruchomo."}, {"id": "leg-ext", "q": "leg extension machine form", "nazwa": "Prostowanie nóg na maszynie", "en": "leg extension", "partia": "nogi", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "ext", "st": {"m": 0.25}, "poz": "Siad głęboko na maszynie, plecy przy oparciu, oś obrotu na wysokości kolan, wałek tuż nad kostkami.", "ruch": "Wyprostuj kolana do pełnego wyprostu, zatrzymaj 1 sekundę z napięciem ud. Opuszczaj powoli, 2-3 sekundy, bez opuszczania ciężaru na stos.", "odd": "Wydech przy prostowaniu, wdech przy opuszczaniu.", "blad": "Odrywanie miednicy od siedziska i szarpanie ciężaru.", "wsk": "Lędźwie dociśnięte do oparcia, ruch płynny w obie strony."}, {"id": "prostowanie-guma", "q": "seated banded leg extension chair", "nazwa": "Prostowanie nogi z gumą siedząc", "en": "seated band leg extension", "partia": "nogi", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "ext", "stDom": "guma średnia zaczepiona z tyłu o nogę krzesła i o kostkę", "poz": "Siad na krześle, plecy proste, guma zaczepiona z tyłu (o tylną nogę krzesła) i o kostkę. Dłonie trzymają brzegi siedziska.", "ruch": "Wyprostuj kolano do pełnego wyprostu, zatrzymaj 1 sekundę, wróć powoli. Wszystkie powtórzenia jedną nogą, potem zmiana.", "odd": "Wydech przy prostowaniu, wdech przy powrocie.", "blad": "Odchylanie się w tył i pomaganie sobie tułowiem.", "wsk": "Siedź pionowo, dłonie na krześle dla stabilizacji, pracuje samo kolano."}, {"id": "odwodzenie-maszyna", "q": "hip abduction machine seated", "nazwa": "Odwodzenie nóg na maszynie", "en": "hip abduction", "partia": "pośladki", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "abdSit", "st": {"m": 0.3}, "poz": "Siad na maszynie, plecy przy oparciu, uda przy poduszkach, stopy na podpórkach.", "ruch": "Rozchyl uda na zewnątrz, pokonując opór, do komfortowego zakresu. Zatrzymaj 1 sekundę w rozwarciu, wróć powoli, nie pozwalając ciężarowi ściągnąć nóg z klapnięciem.", "odd": "Wydech przy rozchylaniu, wdech przy powrocie.", "blad": "Odchylanie tułowia i szarpanie zamiast płynnej pracy.", "wsk": "Plecy przy oparciu, ruch spokojny, zatrzymaj 1 s w rozwarciu."}, {"id": "odwodzenie-guma", "q": "standing banded hip abduction", "nazwa": "Odwodzenie nogi z gumą", "en": "band hip abduction", "partia": "pośladki", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "abd", "stDom": "guma lekka nad kostkami lub średnia nad kolanami", "poz": "Guma nad kostkami (trudniej) lub nad kolanami (łatwiej). Stań bokiem do ściany i przytrzymaj się jej, ciężar na nodze bliżej ściany.", "ruch": "Odwiedź zewnętrzną nogę w bok, stopa równolegle do podłogi, tułów nieruchomo. Wróć powoli. Alternatywa: kroki w bok z gumą w półprzysiadzie.", "odd": "Wydech przy odwodzeniu, wdech przy powrocie.", "blad": "Pochylanie tułowia w przeciwną stronę, żeby unieść nogę wyżej.", "wsk": "Tułów pionowo i nieruchomo. Niższy, czysty ruch jest lepszy niż wysoki z wygięciem."}, {"id": "face-pull-wyciag", "q": "cable face pull form", "nazwa": "Face pull na wyciągu", "en": "cable face pull", "partia": "barki", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "facepull", "st": {"m": 0.15}, "poz": "Lina na wyciągu ustawiona na wysokości twarzy. Złap końce nachwytem, zrób krok w tył i lekki wykrok dla stabilności, ramiona wyciągnięte.", "ruch": "Przyciągnij końce liny do wysokości uszu, rozciągając linę na boki, łokcie szeroko i wysoko. Zatrzymaj 1 sekundę ze ściągniętymi łopatkami, wróć powoli.", "odd": "Wydech przy przyciąganiu, wdech przy powrocie.", "blad": "Ciągnięcie do klatki z łokciami przy tułowiu (robi się z tego wiosłowanie).", "wsk": "Tułów pionowo, lekki wykrok dla stabilności, brzuch napięty."}, {"id": "face-pull-guma", "q": "resistance band face pull", "nazwa": "Face pull z gumą", "en": "band face pull", "partia": "barki", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "facepull", "stDom": "guma lekka zaczepiona na wysokości twarzy", "poz": "Guma zaczepiona na wysokości twarzy (góra drzwi). Złap końce, odejdź do lekkiego napięcia, lekki wykrok.", "ruch": "Przyciągnij końce gumy do wysokości uszu, rozciągając ją na boki, łokcie szeroko i wysoko. Zatrzymaj 1 sekundę, wróć powoli.", "odd": "Wydech przy przyciąganiu, wdech przy powrocie.", "blad": "Odchylanie tułowia w tył pod koniec serii.", "wsk": "Stój stabilnie, żebra w dół, bez przeprostu lędźwi."}, {"id": "ohp-maszyna", "q": "seated shoulder press machine form", "nazwa": "Wyciskanie nad głowę siedząc na maszynie", "en": "seated machine shoulder press", "partia": "barki", "sprzet": ["s"], "safety": "warn", "typ": "w", "fig": "ohp", "st": {"m": 0.2}, "poz": "Siad z pełnym podparciem pleców, uchwyty na wysokości uszu lub odrobinę wyżej, stopy płasko na podłodze.", "ruch": "Wypchnij uchwyty nad głowę do prawie pełnego wyprostu łokci. Opuszczaj powoli do wysokości uszu, nie niżej.", "odd": "Wydech przy wypychaniu, wdech przy opuszczaniu.", "blad": "Odrywanie lędźwi od oparcia i wyginanie się w łuk przy dociskaniu ostatnich powtórzeń.", "wsk": "Lędźwie dociśnięte do oparcia przez cały ruch. Jak zaczynasz się wyginać, kończysz serię."}, {"id": "ohp-guma-siad", "q": "seated resistance band shoulder press", "nazwa": "Wyciskanie gumy nad głowę siedząc", "en": "seated band overhead press", "partia": "barki", "sprzet": ["d"], "safety": "warn", "typ": "w", "fig": "ohp", "stDom": "guma lekka lub średnia przełożona pod siedziskiem krzesła", "poz": "Siad na krześle z oparciem, guma przełożona pod siedziskiem (albo pod pośladkami), końce trzymane przy barkach, plecy przy oparciu.", "ruch": "Wypchnij końce gumy pionowo nad głowę do prawie pełnego wyprostu. Opuszczaj powoli do wysokości barków.", "odd": "Wydech przy wypychaniu, wdech przy opuszczaniu.", "blad": "Przeprost lędźwi i wypychanie żeber w przód.", "wsk": "Plecy dociśnięte do oparcia krzesła, żebra w dół, brzuch napięty przez cały ruch. To najczęstsze miejsce, gdzie lędźwie uciekają w przeprost — jak czujesz odcinek lędźwiowy, zmniejsz gumę albo pomiń wyciskanie nad głowę do czasu MRI."}, {"id": "rozpietki-maszyna", "q": "pec deck machine form", "nazwa": "Rozpiętki na maszynie", "en": "pec deck / machine fly", "partia": "klatka", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "fly", "st": {"m": 0.25}, "poz": "Siad z plecami i głową przy oparciu, ramiona na poduszkach lub uchwytach na wysokości środka klatki, łokcie lekko ugięte.", "ruch": "Złącz ramiona przed sobą półkolistym ruchem, poczuj napięcie klatki, zatrzymaj 1 sekundę. Wracaj powoli do komfortowego rozciągnięcia, nie na siłę maksymalnie w tył.", "odd": "Wydech przy łączeniu, wdech przy rozciąganiu.", "blad": "Za głębokie rozciąganie w tył i szarpanie ciężaru.", "wsk": "Plecy i głowa przy oparciu, ruch płynny, kontrolowany zakres."}, {"id": "rozpietki-guma", "q": "resistance band chest fly", "nazwa": "Rozpiętki z gumą", "en": "band fly", "partia": "klatka", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "fly", "stDom": "guma lekka za plecami na wysokości klatki", "poz": "Guma zaczepiona za plecami na wysokości klatki (albo przełożona przez plecy). Lekki wykrok, ramiona rozłożone na boki, łokcie minimalnie ugięte.", "ruch": "Złącz ramiona przed sobą półkolistym ruchem, dłonie spotykają się na wysokości mostka. Zatrzymaj 1 sekundę, wróć powoli.", "odd": "Wydech przy łączeniu, wdech przy powrocie.", "blad": "Pochylanie się w przód całym ciałem zamiast pracy klatki.", "wsk": "Lekki wykrok, tułów stabilny, brzuch napięty."}, {"id": "lydki", "q": "seated calf raise dumbbell", "nazwa": "Wspięcia na palce", "en": "calf raise", "partia": "łydki", "sprzet": ["s", "d"], "safety": "safe", "typ": "w", "fig": "calf", "st": {"kg": 10}, "stDom": "masa ciała na krawędzi stopnia; w wersji siedzącej połóż na udach cokolwiek cięższego (plecak, butelki)", "poz": "Trzy równorzędne wersje. Siedząc (najbezpieczniejsza dla lędźwi): usiądź, palce i śródstopie na stopniu lub grubej książce, pięty poza krawędzią, obciążenie (hantle, talerz, na siłowni wałek maszyny) połóż na udach tuż nad kolanami. Stojąc: palce na krawędzi stopnia, bez ciężaru na barkach, przytrzymaj się dla równowagi. Na suwnicy: stopy palcami na dolnej krawędzi platformy.", "ruch": "Opuść pięty powoli poniżej poziomu stopnia do uczucia rozciągania łydek, potem unieś maksymalnie na palce i zatrzymaj 1-2 sekundy. Pełny, powolny zakres — to ważne przy sztywniejących stopach.", "odd": "Wydech przy unoszeniu, wdech przy opuszczaniu.", "blad": "Krótki, sprężynujący ruch bez pełnego zakresu.", "wsk": "Nigdy z dodatkowym ciężarem na barkach. Obciążenie tylko na udach (siedząc) albo przez platformę suwnicy."}, {"id": "kickback", "q": "quadruped banded glute kickback", "nazwa": "Wyprost biodra w klęku podpartym", "en": "glute kickback", "partia": "pośladki", "sprzet": ["s", "d"], "safety": "safe", "typ": "w", "fig": "kick", "st": {"kg": 10}, "stDom": "guma średnia zaczepiona o stopę i przytrzymana pod dłońmi", "poz": "Klęk podparty: dłonie pod barkami, kolana pod biodrami, plecy neutralnie, brzuch napięty. Guma o stopę i pod dłońmi (dom) albo pasek maszyny o kostkę (siłownia).", "ruch": "Wypchnij piętę w tył i lekko w górę, prostując nogę do linii tułowia, siłą pośladka. Zatrzymaj 1 sekundę, wróć powoli, nie kładąc kolana. Wszystkie powtórzenia jedną nogą, potem zmiana.", "odd": "Wydech przy wypychaniu, wdech przy powrocie.", "blad": "Unoszenie nogi ponad linię tułowia kosztem przeprostu lędźwi.", "wsk": "Noga kończy w linii pleców, nie wyżej. Brzuch napięty, lędźwie nieruchomo jak w bird dog."}, {"id": "plank", "q": "forearm plank correct form", "nazwa": "Plank (deska) na przedramionach", "en": "plank", "partia": "core", "sprzet": ["s", "d"], "safety": "safe", "typ": "t", "fig": "plank", "poz": "Podpór na przedramionach (łokcie pod barkami) i palcach stóp. Ciało w jednej linii od głowy do pięt, wzrok w podłogę.", "ruch": "Napnij brzuch i pośladki, podwiń lekko miednicę i po prostu utrzymaj pozycję bez ruchu przez zadany czas. Wersja łatwiejsza: na kolanach.", "odd": "Oddychaj spokojnie i równo, nie wstrzymuj powietrza.", "blad": "Opadające biodra i zapadnięte lędźwie albo biodra wypchnięte wysoko w górę.", "wsk": "Podwiń lekko miednicę, żebra w dół. Krótsze, czyste serie zamiast długiego wisienia na lędźwiach."}, {"id": "plank-boczny", "q": "side plank correct form", "nazwa": "Plank boczny", "en": "side plank", "partia": "core", "sprzet": ["s", "d"], "safety": "safe", "typ": "t", "fig": "sideplank", "poz": "Leżenie bokiem, podpór na przedramieniu (łokieć pod barkiem), stopy jedna na drugiej lub jedna przed drugą. Wersja łatwiejsza: na kolanach.", "ruch": "Unieś biodra tak, żeby ciało tworzyło jedną linię od głowy do stóp, i utrzymaj przez zadany czas. Czas liczysz na każdą stronę osobno.", "odd": "Oddychaj spokojnie, nie wstrzymuj powietrza.", "blad": "Opadanie bioder do podłogi i skręcanie tułowia.", "wsk": "Element wielkiej trójki McGilla. Biodro wypchnięte w górę, ciało w jednej linii od głowy do stóp."}, {"id": "bird-dog", "q": "bird dog exercise form", "nazwa": "Ptak-pies", "en": "bird dog", "partia": "core", "sprzet": ["s", "d"], "safety": "safe", "typ": "r", "fig": "birddog", "poz": "Klęk podparty: dłonie pod barkami, kolana pod biodrami, plecy neutralnie (naturalna, mała krzywizna lędźwi), kark w przedłużeniu pleców.", "ruch": "Wyciągnij jednocześnie przeciwną rękę w przód i nogę w tył do linii tułowia. Zatrzymaj 2-3 sekundy bez ruchu bioder, wróć powoli. Powtórzenia liczysz na stronę.", "odd": "Wydech przy wyciąganiu, wdech przy powrocie.", "blad": "Rotacja miednicy i unoszenie nogi ponad linię pleców.", "wsk": "Wyobraź sobie szklankę wody na lędźwiach: nie może się wylać. Ruch idzie z bioder i barków, kręgosłup stoi."}, {"id": "dead-bug", "q": "dead bug exercise form", "nazwa": "Martwy robak", "en": "dead bug", "partia": "core", "sprzet": ["s", "d"], "safety": "safe", "typ": "r", "fig": "deadbug", "poz": "Leżenie na plecach, ramiona pionowo nad klatką, biodra i kolana zgięte pod kątem 90 stopni (kolana nad biodrami). Lędźwie dociśnięte do podłogi.", "ruch": "Opuść powoli przeciwną rękę za głowę i nogę tuż nad podłogę, nie odrywając lędźwi. Wróć i zmień stronę. Powtórzenia liczysz na stronę.", "odd": "Wydech przy opuszczaniu kończyn, wdech przy powrocie.", "blad": "Odrywanie lędźwi od podłogi przy opuszczaniu nogi.", "wsk": "Lędźwie dociśnięte do podłogi przez cały ruch. Jak się odrywają, skróć zakres opuszczania nogi."}, {"id": "pallof-wyciag", "q": "cable pallof press", "nazwa": "Pallof press na wyciągu", "en": "cable pallof press", "partia": "core", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "pallof", "st": {"kg": 10}, "poz": "Stań bokiem do wyciągu ustawionego na wysokości mostka, uchwyt w obu dłoniach przy mostku, stopy na szerokość bioder, kolana minimalnie ugięte.", "ruch": "Wypchnij ręce powoli przed siebie i utrzymaj 2-3 sekundy, nie pozwalając ciężarowi obrócić tułowia w stronę wyciągu. Wróć do mostka. Powtórzenia na stronę.", "odd": "Oddychaj spokojnie, nie wstrzymuj powietrza przy wypchnięciu.", "blad": "Rotacja tułowia w stronę wyciągu przy wypchnięciu.", "wsk": "Core antyrotacyjny: cała robota to NIE ruszać tułowiem. Biodra i barki cały czas w jednej linii."}, {"id": "pallof-guma", "q": "resistance band pallof press", "nazwa": "Pallof press z gumą", "en": "band pallof press", "partia": "core", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "pallof", "stDom": "guma lekka — liczy się utrzymanie pozycji, nie wielkość oporu", "poz": "Guma zaczepiona bokiem na wysokości mostka. Odejdź do wyraźnego napięcia, końce w obu dłoniach przy mostku, stopy na szerokość bioder.", "ruch": "Wypchnij ręce powoli przed siebie i utrzymaj 2-3 sekundy, nie pozwalając gumie obrócić tułowia. Wróć do mostka. Powtórzenia na stronę.", "odd": "Oddychaj spokojnie, nie wstrzymuj powietrza.", "blad": "Uciekanie bioder i skręt tułowia w stronę zaczepu.", "wsk": "Stój na szerokość bioder, brzuch napięty, kręgosłup nieruchomo."}, {"id": "wiosl-wyciag-dolny", "q": "seated cable row form", "nazwa": "Wiosłowanie na wyciągu dolnym siedząc", "en": "seated cable row", "partia": "plecy", "sprzet": ["s"], "safety": "warn", "typ": "w", "fig": "row", "st": {"m": 0.3}, "poz": "Siad na ławeczce wyciągu, stopy na podpórkach, kolana lekko ugięte, tułów pionowo, uchwyt w dłoniach.", "ruch": "Przyciągnij uchwyt do brzucha, ściągając łopatki, łokcie przy tułowiu. Zatrzymaj 1 s, wróć powoli, nie pochylając się za ciężarem.", "odd": "Wydech przy przyciąganiu, wdech przy powrocie.", "blad": "Bujanie tułowiem w przód-tył i zaokrąglanie pleców przy powrocie.", "wsk": "Tułów trzymasz pionowo sam, bez podparcia — dlatego mniejszy ciężar i zero bujania. Jak nie da się bez bujania, wróć do wiosłowania z podparciem klatki."}, {"id": "podciaganie-asysta", "q": "assisted pull up machine", "nazwa": "Podciąganie na maszynie z asystą", "en": "assisted pull-up", "partia": "plecy", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "pull", "poz": "Ustaw przeciwwagę tak, żebyś dał radę zrobić 8-12 powtórzeń. Kolana lub stopy na platformie asysty, chwyt nieco szerzej niż barki.", "ruch": "Podciągnij się, prowadząc łokcie w dół, aż broda znajdzie się przy drążku. Opuszczaj się powoli do prawie pełnego wyprostu ramion.", "odd": "Wydech przy podciąganiu, wdech przy opuszczaniu.", "blad": "Skracanie ruchu w dole i szarpanie na starcie.", "wsk": "Wpisuj w kg wartość asysty z maszyny — tu postęp to CORAZ MNIEJSZA liczba. Ciało pionowo, bez bujania nogami."}, {"id": "przywodzenie-maszyna", "q": "hip adduction machine", "nazwa": "Przywodzenie nóg na maszynie", "en": "hip adduction", "partia": "nogi", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "abdSit", "st": {"m": 0.25}, "poz": "Siad na maszynie, plecy przy oparciu, uda rozchylone przy poduszkach (ruch odwrotny niż na rysunku odwodzenia: z szeroka do środka).", "ruch": "Zewrzyj uda do środka, pokonując opór, zatrzymaj 1 s, wracaj powoli do komfortowego rozwarcia.", "odd": "Wydech przy zwieraniu, wdech przy powrocie.", "blad": "Za szerokie ustawienie startowe i szarpanie ciężaru.", "wsk": "Plecy przy oparciu, zakres tylko komfortowy, bez uczucia ciągnięcia w pachwinie."}, {"id": "biceps-maszyna", "q": "preacher curl machine", "nazwa": "Uginanie ramion na maszynie (modlitewnik)", "en": "machine preacher curl", "partia": "ramiona", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "biceps", "st": {"kg": 15}, "poz": "Siad, ramiona oparte całą długością o poduszkę modlitewnika, uchwyty w dłoniach, plecy proste.", "ruch": "Ugnij łokcie, przyciągając uchwyty do barków, zatrzymaj moment, opuszczaj powoli do prawie pełnego wyprostu.", "odd": "Wydech przy uginaniu, wdech przy opuszczaniu.", "blad": "Odrywanie ramion od poduszki i pomaganie sobie plecami.", "wsk": "Poduszka trzyma ramiona, więc lędźwie nie pracują — właśnie dlatego ta wersja, a nie uginanie stojąc z dużym ciężarem."}, {"id": "biceps-guma", "q": "resistance band biceps curl", "nazwa": "Uginanie ramion z gumą", "en": "band biceps curl", "partia": "ramiona", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "biceps", "stDom": "guma lekka lub średnia pod stopami", "poz": "Stań na gumie obiema stopami, końce w dłoniach, łokcie przy tułowiu, brzuch napięty.", "ruch": "Ugnij łokcie, przyciągając dłonie do barków, łokcie nieruchomo przy tułowiu. Opuszczaj powoli.", "odd": "Wydech przy uginaniu, wdech przy opuszczaniu.", "blad": "Bujanie tułowiem i wyginanie lędźwi przy zmęczeniu.", "wsk": "Żebra w dół, tułów pionowo. Lżejsza guma zamiast odchylania się w tył."}, {"id": "triceps-wyciag", "q": "cable triceps pushdown", "nazwa": "Prostowanie ramion na wyciągu", "en": "triceps pushdown", "partia": "ramiona", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "triceps", "st": {"kg": 15}, "poz": "Stań przodem do wyciągu górnego, uchwyt lub lina w dłoniach, łokcie przyklejone do tułowia, lekki wykrok.", "ruch": "Wyprostuj łokcie, dociskając uchwyt w dół, zatrzymaj 1 s z napiętym tricepsem, wracaj powoli do kąta prostego.", "odd": "Wydech przy prostowaniu, wdech przy powrocie.", "blad": "Pochylanie się nad wyciągiem i dociskanie ciężaru masą ciała.", "wsk": "Tułów pionowo, brzuch napięty, pracują tylko przedramiona wokół łokcia."}, {"id": "triceps-guma", "q": "band triceps pushdown", "nazwa": "Prostowanie ramion z gumą", "en": "band triceps pushdown", "partia": "ramiona", "sprzet": ["d"], "safety": "safe", "typ": "w", "fig": "triceps", "stDom": "guma lekka zaczepiona u góry drzwi", "poz": "Guma zaczepiona u góry. Stań przodem, końce w dłoniach, łokcie przy tułowiu, lekki wykrok.", "ruch": "Wyprostuj łokcie w dół, zatrzymaj 1 s, wracaj powoli do kąta prostego w łokciu.", "odd": "Wydech przy prostowaniu, wdech przy powrocie.", "blad": "Odsuwanie łokci od tułowia — ruch zamienia się w ściąganie.", "wsk": "Łokcie przyklejone do żeber przez całą serię, tułów pionowo."}, {"id": "wyciskanie-skos-maszyna", "q": "incline chest press machine", "nazwa": "Wyciskanie skośne na maszynie", "en": "incline chest press", "partia": "klatka", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "press", "st": {"m": 0.25}, "poz": "Siad na maszynie skośnej, plecy i głowa przy oparciu, uchwyty na wysokości górnej części klatki, stopy płasko.", "ruch": "Wypchnij uchwyty w górę-przód do prawie pełnego wyprostu, wracaj powoli do lekkiego rozciągnięcia górnej klatki.", "odd": "Wydech przy wypychaniu, wdech przy powrocie.", "blad": "Mostkowanie i odrywanie lędźwi od oparcia.", "wsk": "Lędźwie dociśnięte do oparcia przez cały ruch, żebra w dół."}, {"id": "wyciskanie-hantle-lawka", "q": "dumbbell bench press form", "nazwa": "Wyciskanie hantli na ławce", "en": "dumbbell bench press", "partia": "klatka", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "press", "st": {"kg": 12.5}, "poz": "Leżenie na ławce płaskiej lub lekko skośnej, stopy płasko na podłodze, hantle nad klatką, łopatki ściągnięte. Ciężar wpisuj na jeden hantel.", "ruch": "Opuść hantle powoli do boków klatki (łokcie ok. 45 stopni od tułowia), wypchnij do góry bez stykania hantli z hukiem.", "odd": "Wdech przy opuszczaniu, wydech przy wypychaniu.", "blad": "Mostkowanie lędźwi, żeby dopchnąć ciężar.", "wsk": "Naturalna, mała krzywizna lędźwi jest ok, ale bez wypychania brzucha w górę. Hantle bierz ze stojaka, nie z podłogi zamachem."}, {"id": "brama-krzyzowanie", "q": "cable crossover chest fly", "nazwa": "Krzyżowanie linek na bramie", "en": "cable crossover", "partia": "klatka", "sprzet": ["s"], "safety": "safe", "typ": "w", "fig": "fly", "st": {"kg": 10}, "poz": "Stań między słupkami bramy, uchwyty w dłoniach, wyciągi na wysokości klatki lub lekko wyżej, lekki wykrok, łokcie minimalnie ugięte. Ciężar wpisuj na jedną stronę.", "ruch": "Prowadź dłonie półkolistym ruchem do złączenia przed mostkiem, zatrzymaj 1 s, wracaj powoli do komfortowego rozciągnięcia.", "odd": "Wydech przy łączeniu, wdech przy powrocie.", "blad": "Pochylanie się i dociskanie ciężaru całym tułowiem.", "wsk": "Tułów nieruchomy, brzuch napięty, mniejszy ciężar zamiast bujania."}, {"id": "sciaganie-neutral", "q": "close grip lat pulldown v bar", "nazwa": "Ścią function przelaczKarte(k){var byla=rozwiniete[k]!==undefined?rozwiniete[k]:false;rozwiniete[k]=!byla;pokaz('trening',true);if(!byla){var el=document.getElementById(k);if(el){window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+(window.scrollY||0)-10));}}}

function kopiujSerie(id){var w=S.aktywna.wpisy[id]=S.aktywna.wpisy[id]||[];var zrod=null;for(var i=w.length-1;i>=0;i--){if(w[i].p!==''&&w[i].p!=null){zrod=w[i];break;}}if(!zrod){var o=ostatnieWpisy(id,1);if(o.length)zrod=o[0].serie[o[0].serie.length-1];}if(!zrod){alert('Brak wypełnionej serii do powielenia.');return;}var pust=-1;for(var j=0;j<w.length;j++){if(w[j].p===''||w[j].p==null){pust=j;break;}}var kopia={c:zrod.c,p:zrod.p,rpe:zrod.rpe};if(pust<0)w.push(kopia);else w[pust]=kopia;save();pokaz('trening',true,kluczKarty(id));timerPrzerwy((S.aktywna.prz&&S.aktywna.prz[id])||75);}

  h+='<div class="filters"><button class="chip '+(filtrPartia===''?'on':'')+'" onclick="filtrPartia=\'\';pokaz(\'biblioteka\',true)">wszystkie</button>'+partie.map(function(p){return '<button class="chip '+(filtrPartia===p?'on':'')+'" onclick="filtrPartia=\''+p+'\';pokaz(\'biblioteka\',true)">'+esc(p)+'</button>';}).join('')+'</div>';
  lista.forEach(function(ex){
    h+='<div class="card"><div style="display:flex;align-items:flex-start;gap:10px"><div class="exicon" style="width:48px;height:42px">'+ikonaCw(ex.fig,36,ikonKolor(ex))+'</div><div style="flex:1"><h3 style="margin-bottom:2px">'+esc(ex.nazwa)+'</h3><div class="tiny muted">'+esc(ex.en)+' · '+esc(ex.partia)+' · '+ex.sprzet.map(function(s){return s==='s'?'siłownia':'dom';}).join('/')+'</div></div>'+tagHTML(ex.safety)+'</div>';
    if(ex.safety==='block'){h+=spineTip(ex.wsk);}else{
      h+='<div class="row2" style="margin:6px 0"><a class="btn small secondary" style="width:100%;text-align:center;text-decoration:none" href="https://www.google.com/search?tbm=isch&q='+linkQ(ex,ex.sprzet.indexOf('s')>=0?'s':'d')+'" target="_blank" rel="noopener">📷 Jak wygląda</a><a class="btn small secondary" style="width:100%;text-align:center;text-decoration:none" href="https://www.youtube.com/results?search_query='+linkQ(ex,ex.sprzet.indexOf('s')>=0?'s':'d')+'" target="_blank" rel="noopener">▶ Wideo</a></div>';
      if(ex.poz)h+='<p class="small"><b>Pozycja:</b> '+esc(ex.poz)+'</p>';
      if(ex.ruch)h+='<p class="small"><b>Ruch:</b> '+esc(ex.ruch)+'</p>';
      if(ex.odd)h+='<p class="small"><b>Oddech:</b> '+esc(ex.odd)+'</p>';
      h+=spineTip(ex.wsk);
    }
    h+='</div>';
  });
  return h;
}

/* ===== USTAWIENIA ===== */
function renderUstawienia(){
  var p=S.profil;
  var h='<p class="eyebrow">Ustawienia</p><h1>Ustawienia</h1>';
  h+='<div class="notice">Plan nie zastępuje konsultacji z lekarzem lub fizjoterapeutą. Po wyniku MRI skonsultuj listę ćwiczeń.</div>';
  h+='<div class="card"><h3>Profil</h3><div class="row2"><label class="fld"><span>Wzrost (cm)</span><input type="number" value="'+p.wzrost+'" onchange="S.profil.wzrost=+this.value||S.profil.wzrost;save()"></label><label class="fld"><span>Waga (kg)</span><input type="number" step="0.1" value="'+p.waga+'" onchange="S.profil.waga=+this.value||S.profil.waga;save()"></label></div></div>';
  h+='<div class="card"><h3>Tryb bezpieczeństwa</h3><p class="small muted">Ostrożny blokuje ćwiczenia obciążające osiowo lędźwie (martwy ciąg, przysiad ze sztangą, brzuszki, Smith, hack, skoki).</p><div class="seg"><button class="'+(ostrozny()?'on':'')+'" onclick="zmienTryb(\'ostrozny\')">🛡 Ostrożny</button><button class="'+(!ostrozny()?'on':'')+'" onclick="zmienTryb(\'rozszerzony\')">Rozszerzony</button></div></div>';
  h+='<div class="card"><h3>Sygnały timerów</h3><div class="seg"><button class="'+(S.ust.wibracje?'on':'')+'" onclick="S.ust.wibracje=true;save();pokaz(\'ustawienia\')">Wibracje wł.</button><button class="'+(!S.ust.wibracje?'on':'')+'" onclick="S.ust.wibracje=false;save();pokaz(\'ustawienia\')">Wibracje wył.</button></div><p class="tiny muted">Na iPhonie wibracje w przeglądarce nie działają — aplikacja użyje dźwięku i mignięcia ekranu.</p><button class="btn small secondary" onclick="sygnal(\'cwiczenie\')">Przetestuj sygnał</button></div>';
  var proc=Math.round((S.ust.fscale||1)*100);
  h+='<div class="card"><h3>Wielkość liter: <b style="color:var(--accent)" id="fscaleVal">'+proc+'%</b></h3>'+
     '<input type="range" min="80" max="160" step="5" value="'+proc+'" style="width:100%;accent-color:var(--accent);height:40px" '+
     'oninput="document.getElementById(\'fscaleVal\').textContent=this.value+\'%\';S.ust.fscale=this.value/100;document.documentElement.style.setProperty(\'--fscale\',S.ust.fscale)" '+
     'onchange="save();ustawStickyPoz()">'+
     '<p class="tiny muted">Przesuń palcem, żeby ustawić rozmiar tekstu. Podgląd zmienia się od razu. Domyślnie 100%.</p>'+
     '<button class="btn small secondary" onclick="S.ust.fscale=1;save();zastosujCzcionke();pokaz(\'ustawienia\')">Reset do 100%</button></div>';
  if(S.planOverride)h+='<div class="card"><h3>Plan treningowy</h3><p class="tiny muted">Masz własne stałe podmiany w planie A/B/C.</p><button class="btn small secondary" onclick="if(confirm(\'Przywrócić domyślny plan? Historia zostaje.\')){S.planOverride=null;save();pokaz(\'ustawienia\')}">Przywróć domyślny plan</button></div>';
  h+='<div class="card"><h3>Dane ('+S.sesje.length+' sesji)</h3><p class="small muted">Wszystko na telefonie. Rób backup co tydzień.</p><div class="row2"><button class="btn small secondary" style="width:100%" onclick="eksport(\'json\')">Eksport JSON</button><button class="btn small secondary" style="width:100%" onclick="eksport(\'csv\')">Eksport CSV</button></div><label class="fld" style="margin-top:10px"><span>Import z pliku JSON (także ze starej wersji)</span><input type="file" accept=".json" onchange="importuj(this)"></label><button class="btn danger" style="margin-top:8px" onclick="if(confirm(\'Skasować WSZYSTKIE dane?\')){MAG.del(KEY);location.reload()}">Wyczyść wszystkie dane</button></div>';
  return h;
}
function zmienTryb(t){if(t==='rozszerzony'&&ostrozny()){if(!confirm('Tryb rozszerzony odblokowuje ćwiczenia z czarnej listy. Włącz dopiero po konsultacji wyniku MRI z lekarzem lub fizjoterapeutą. Potwierdzasz konsultację?'))return;}S.profil.tryb=t;save();pokaz('ustawienia');}
function zastosujCzcionke(){document.documentElement.style.setProperty('--fscale',S.ust.fscale||1);ustawStickyPoz();}
function eksport(fmt){var blob,nazwa;if(fmt==='json'){blob=new Blob([JSON.stringify({profil:S.profil,sesje:S.sesje,planOverride:S.planOverride},null,2)],{type:'application/json'});nazwa='trening-backup-'+dzis()+'.json';}else{var csv='data;typ;wariant;cwiczenie;seria;ciezar;powt_lub_sek;rpe;czas_min;cardio_min;kcal;samopoczucie;bol;notatka\n';S.sesje.forEach(function(s){var cm=s.cardio.reduce(function(x,c){return x+c.min;},0);Object.keys(s.wpisy).forEach(function(id){s.wpisy[id].forEach(function(x,i){csv+=[s.data,s.typ,s.wariant,(EXBYID[id]?EXBYID[id].nazwa:id),i+1,x.c==null?'':x.c,x.p==null?'':x.p,x.rpe==null?'':x.rpe,s.czas,cm,s.kcal||'',s.samopoczucie,s.bol,'"'+String(s.notatka||'').replace(/"/g,'""')+'"'].join(';')+'\n';});});});blob=new Blob(['\ufeff'+csv],{type:'text/csv'});nazwa='trening-'+dzis()+'.csv';}var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nazwa;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
function importuj(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.sesje||!d.profil)throw 0;if(confirm('Wczytać backup? Nadpisze '+S.sesje.length+' sesji danymi z pliku ('+d.sesje.length+' sesji).')){S.profil=d.profil;S.sesje=d.sesje;S.planOverride=d.planOverride||null;save();pokaz('ustawienia');}}catch(e){alert('To nie wygląda na poprawny plik backupu.');}};r.readAsText(f);}

/* ===== EDYCJA PLANU (dostęp z ustawień jako zapas) ===== */
function renderPlanEdycja(){return renderUstawienia();}

/* ===== START ===== */
zastosujCzcionke();
wznowTimer();
setInterval(function(){if(ekran==='trening'&&S.aktywna&&!TIMER){var e=document.querySelector('.eyebrow');if(e)e.textContent='Trening w toku · '+fmtT((Date.now()-S.aktywna.start)/1000);}},5000);
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
pokaz(S.aktywna?'trening':'dzis');

function ustawDolnyOdstep(){try{var nav=document.getElementById('tabs'),bar=document.getElementById('akcjaBar'),st=document.getElementById('stickyTimer');var h=nav.offsetHeight+(bar.classList.contains('show')?bar.offsetHeight:0)+(st.classList.contains('show')?st.offsetHeight+16:0)+40;app.style.paddingBottom=h+'px';ustawStickyPoz();}catch(e){}}
window.addEventListener('resize',ustawDolnyOdstep);
setInterval(ustawDolnyOdstep,700);

</script>
